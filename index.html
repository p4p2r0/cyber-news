<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Live cybersecurity news from top-tier sources, pick one source at a time and pin what matters.">
<title>Cyber News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>Cyber News</span>
        <span id="live-indicator" class="status live">● LIVE</span>
    </div>

    <div class="toolbar">
        <label for="source-select" class="toolbar-label">Source</label>
        <select id="source-select"></select>
        <span class="toolbar-sync" id="sync-info"></span>
    </div>

    <div class="content">
        <div id="pinned-section" class="pinned-section hidden">
            <div class="section-label">Pinned</div>
            <div id="pinned-list" class="feed-list"></div>
        </div>

        <div id="feed-list" class="feed-list">
            <div class="meta">Loading...</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
